<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T3 Code slopbase growth</title>
<style>
/* Lakebed homepage theme, from lakebed.dev's own CSS variables. The page is dark-only, so the chart is too.
   Text #f5f5f5 on #000, muted #aaa, rules #242424, code surface #080808, links and focus #8ab4ff, control hover #4a4a4a.
   Blue marks links, focus, selection and major milestones; the data line and other large-PR diamonds use the page text color. */
:root{
  color-scheme:dark;
  --surface:#000000;
  --fg:#f5f5f5;
  --muted:#aaaaaa;
  --line:#242424;
  --code-bg:#080808;
  --control-hover:#4a4a4a;
  --link:#8ab4ff;
  --accent:#8ab4ff;
  --pr:#f5f5f5;
  --accent-soft:color-mix(in srgb,var(--accent) 14%,transparent);
  --track:color-mix(in srgb,var(--fg) 8%,transparent);
  --series-fill:rgb(245 245 245 / 0.07);
  --sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{background:var(--surface);color:var(--fg)}
body{margin:0;background:var(--surface);color:var(--fg);font:400 16px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
main{max-width:920px;margin:0 auto;padding:24px 16px 28px}
@media (min-width:728px){body{font-size:14px}main{padding:40px 24px 32px}}
a{color:var(--link);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
a:hover{color:var(--fg)}
:focus-visible{outline:2px solid var(--link);outline-offset:3px}
header .eyebrow{margin:0 0 8px;font:400 13px/1.4 var(--mono);color:var(--muted)}
h1{margin:0;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:0}
@media (min-width:728px){h1{font-size:36px}}
.lede{margin:10px 0 0;max-width:62ch;font-size:16px;color:var(--muted)}
section{margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
h2{margin:0;font-size:16px;font-weight:600}
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.sub{margin:4px 0 0;font-size:14px;color:var(--muted);max-width:66ch}
@media (min-width:728px){h2{font-size:15px}.sub{font-size:13px}}

/* Disclosures keep one visible chevron, not the native marker */
summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;cursor:pointer;list-style:none;color:var(--fg)}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg)}
details[open]>summary::after{transform:translateY(2px) rotate(-135deg)}

/* Growth chart. The area and the line are the first two direct SVG paths; their JS fills are overridden here. */
.plot{position:relative;margin-top:16px}
svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
svg text{fill:var(--fg);font-size:12px}
#chart>path:nth-of-type(1){fill:var(--series-fill);fill-opacity:1}
#chart>path:nth-of-type(2){stroke:var(--fg)}
.axis text{fill:var(--muted)}
.axis .tick line{stroke:var(--line)}
.marker{cursor:default}
/* One diamond per event commit: filled blue for a major milestone (with or without a PR), hollow white for any other large PR. */
.marker .diamond{fill:var(--surface);stroke:var(--pr);stroke-width:1.5}
.marker.is-on .diamond{fill:var(--pr);stroke-width:2.5}
.marker.major .diamond{fill:var(--accent);stroke:var(--accent)}
.marker.major.is-on .diamond{stroke:var(--fg);stroke-width:2}

/* Key: swatches repeat the chart's own symbols. */
.key{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px}
.key li{display:flex;align-items:center;gap:8px;min-height:24px}
.key svg{display:block;flex:none;width:28px;height:24px;overflow:visible}
.key svg text{font-size:11px;font-weight:500;text-anchor:middle}
.key .k-major{fill:var(--accent);stroke:var(--accent);stroke-width:1.5}
.key .k-diamond{fill:var(--surface);stroke:var(--pr);stroke-width:1.5}
.key .k-line{fill:none;stroke:var(--fg);stroke-width:2}
.key+.sub{margin-top:10px}
@media (min-width:728px){.key{font-size:13px}}
.event-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}
.event-controls select,.event-controls button{min-height:44px;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:0;background:var(--code-bg);color:var(--fg);font:inherit}
.event-controls select:hover,.event-controls button:hover:not(:disabled){border-color:var(--control-hover)}
.event-controls button:disabled{opacity:.45}
.event-page{font-size:13px;color:var(--muted)}
.axis-unit{fill:var(--muted)}
.guide{stroke:var(--muted);pointer-events:none}
.hover-dot{stroke:var(--surface);stroke-width:2;pointer-events:none}
/* Short glide between points; transitions settle and stop, so nothing repaints while idle. */
.guide,.hover-dot{transition:transform 90ms cubic-bezier(.2,.8,.2,1)}
.tip{transition:transform 140ms cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.guide,.hover-dot,.tip{transition:none}}
/* Desktop: the readout floats beside the selected point, on whichever side keeps the point and nearby markers visible. */
.tip{position:absolute;top:0;left:0;max-width:min(300px,calc(100% - 16px));padding:8px 10px;border:1px solid var(--line);background:var(--code-bg);color:var(--fg);font-size:12px;line-height:1.45;overflow-wrap:anywhere;pointer-events:none}
.tip[hidden]{display:none}
.tip strong{font-size:13px;font-weight:600}
.tip span{color:var(--muted)}
/* Phones: the readout sits under the chart and stays put. */
.plot.is-narrow .tip{transform:none!important;transition:none;position:static;max-width:none;min-height:52px;margin-top:10px;padding:10px 0 0;border:0;border-top:1px solid var(--line);background:none;font-size:14px}
.plot.is-narrow .tip strong{font-size:16px}
.plot.is-narrow .tip span{display:none}

/* Milestones: the list is the one legend and the touch control */
.milestone-details{margin-top:16px;font-size:14px}
.milestones{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr;gap:4px 24px}
@media (min-width:560px){.milestones{grid-template-columns:1fr 1fr;margin-top:18px}}
.milestones li{display:flex;align-items:center;margin:0 -8px;border-radius:0}
.milestone{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:center;min-height:44px;padding:8px;margin:0;border:0;border-radius:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.milestone:hover{background:var(--track)}
.milestone.is-on{background:var(--accent-soft)}
.mtext{display:block;min-width:0}
.mlabel{display:block}
.milestones li.major .mlabel{font-weight:600}
.badge svg{display:block;width:16px;height:16px;overflow:visible}
.badge{width:24px;height:24px;display:grid;place-items:center}
.meta{display:block;font-size:13px;color:var(--muted)}
.commit{flex:none;display:flex;align-items:center;min-height:44px;padding:0 10px;font-size:13px;color:var(--muted)}
.note{margin:16px 0 0;font-size:14px;color:var(--muted)}
@media (min-width:728px){.milestone-details{font-size:13px}.milestone{padding:6px 8px}.badge{width:22px;height:22px}.meta{font-size:12px}.commit{font-size:12px}.note{font-size:13px}}

/* Contributors */
.selected{margin-top:12px;padding:0}
.selected .detail-line{margin:4px 0 0;font-size:13px;color:var(--muted)}
.selected .who{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.selected .who strong{font-size:17px;font-weight:600}
.selected .who span{font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin:12px 0 0}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:2px 0 0;font-size:16px;font-weight:600}
.bars{list-style:none;margin:18px 0 0;padding:0}
@media (max-width:559px){.bars{margin-top:12px}}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:10px;row-gap:6px;align-items:center;width:calc(100% + 16px);min-height:52px;margin:0 -8px;padding:10px 8px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row.is-on{background:var(--accent-soft)}
.rank{color:var(--muted);font-size:13px}
.name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.val{font-size:15px;text-align:right}
.track{grid-column:2 / -1;height:6px;border-radius:0;background:var(--track);overflow:hidden}
@media (min-width:560px){
  .row{grid-template-columns:2.25ch minmax(0,12rem) minmax(0,1fr) auto;min-height:0;padding:8px;row-gap:0;border-bottom:0;cursor:default}
  .track{grid-column:3;grid-row:1;height:8px}
  .val{grid-column:4;grid-row:1;font-size:13px}
  .name{font-size:14px}
  .rank{font-size:12px}
}
.fill{display:block;height:100%;border-radius:0;background:var(--accent);opacity:.4}
.row.is-on .fill{opacity:1}

/* Method */
.method{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;line-height:1.6;color:var(--muted)}
.method p{margin:8px 0 0;max-width:72ch}
@media (min-width:728px){.method{font-size:12px}}
</style>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const D = JSON.parse($('#data').textContent);
const C = JSON.parse($('#contributors').textContent);
const fmt = n => n.toLocaleString('en-US');
const signed = n => (n < 0 ? '-' : '+') + Math.abs(n).toLocaleString('en-US');
const pct = v => (v * 100).toFixed(1) + '%';
const base = 'https://github.com/pingdotgg/t3code/commit/';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayLabel = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', {month: 'short', day: 'numeric', timeZone: 'UTC'});
const points = D.points.map(p => ({...p, x: new Date(p.time)})).sort((a, b) => a.x - b.x);
const events = D.events.map(e => ({...e, x: new Date(e.time)}));
const first = D.points[0], last = D.points.at(-1);
const v2 = events.find(e => e.label === 'Orchestrator V2 merged');
const coreEvents = events.filter(e => e.kind !== 'large-pr');
const largeEvents = events.filter(e => e.pr && e.changed > 20000).slice().reverse();
let eventPage = 0;
const prior = D.points[D.points.findIndex(p => p.hash === v2.hash) - 1];
const isMajor = e => e.kind !== 'large-pr';
const diamond = (major, s) => `<path d="M8,${8 - s}l${s},${s}l-${s},${s}l-${s},-${s}Z" fill="${major ? 'var(--accent)' : 'none'}" stroke="${major ? 'var(--accent)' : 'var(--pr)'}" stroke-width="1.5"/>`;
const year = last.date.slice(0, 4);

$('#lede').textContent = `Source-file lines on upstream main grew from ${fmt(first.total)} on ${dayLabel(first.date)} to ${fmt(last.total)} on ${dayLabel(last.date)}, ${year}.`;
function renderEvents() {
  const list = $('#event-filter').value === 'large' ? largeEvents : coreEvents;
  const pages = Math.max(1, Math.ceil(list.length / 10));
  eventPage = Math.min(eventPage, pages - 1);
  $('#milestones').innerHTML = list.slice(eventPage * 10, eventPage * 10 + 10).map(e => `<li${isMajor(e) ? ' class="major"' : ''}><button type="button" class="milestone" data-id="${e.id}" aria-pressed="false"><span class="badge" aria-hidden="true"><svg viewBox="0 0 16 16">${diamond(isMajor(e), isMajor(e) ? 7 : 6)}</svg></span><span class="mtext"><span class="mlabel">${isMajor(e) ? '<span class="visually-hidden">Major milestone: </span>' : ''}${esc(e.label)}</span><span class="meta">${dayLabel(e.date)} · ${e.pr ? 'PR #' + e.pr + ' · ' + fmt(e.changed) + ' changed lines' : fmt(e.total) + ' source lines'}</span></span></button><a class="commit" href="${e.url || base + e.hash}" target="_blank" rel="noopener noreferrer" aria-label="${esc(e.label)}, ${e.pr ? 'PR' : 'commit'} on GitHub">${e.pr ? 'PR' : 'Commit'}</a></li>`).join('');
  $('#event-page').textContent = (eventPage + 1) + ' / ' + pages;
  $('#events-prev').disabled = eventPage === 0;
  $('#events-next').disabled = eventPage === pages - 1;
}
$('#event-filter').addEventListener('change', () => {eventPage = 0; renderEvents(); $('#chart').dispatchEvent(new Event('eventlistchange'));});
for (const [id, step] of [['events-prev', -1], ['events-next', 1]]) $( '#' + id).addEventListener('click', () => {eventPage += step; renderEvents(); $('#chart').dispatchEvent(new Event('eventlistchange'));});
const both = coreEvents.filter(e => e.pr && e.changed > 20000).length, otherLarge = largeEvents.length - both;
$('#event-summary').textContent = 'Explore ' + coreEvents.length + ' milestones and ' + largeEvents.length + ' large PRs';
$('#event-filter option[value="milestones"]').textContent = 'Milestones (' + coreEvents.length + ')';
$('#event-filter option[value="large"]').textContent = 'PRs over 20,000 changed lines (' + largeEvents.length + ')';
$('#key-major').textContent = 'Blue diamond: major milestone (' + coreEvents.length + ')';
$('#key-pr').textContent = 'White diamond: other merged PR over 20,000 changed lines (' + otherLarge + ')';
$('#key-note').textContent = `Each event commit gets one diamond. ${both} major milestones are also large PRs, so their blue diamond carries the PR details. PR size counts added + deleted lines in every file, including docs and lockfiles. The white line counts source files only, so a big PR can move it far less.`;
renderEvents();
$('#v2').textContent = `Orchestrator V2 added ${fmt(v2.total - prior.total)} net source-file lines when it merged on ${dayLabel(v2.date)}, a ${pct(v2.total / prior.total - 1)} increase.`;
$('#method').innerHTML = `${esc(D.metric)} Each point is an exact snapshot on first-parent main, roughly weekly, plus each milestone and the commit before it. Dates are commit timestamps, so markers show when a change reached main. Source: <a href="${base + D.tip.hash}" target="_blank" rel="noopener noreferrer">pingdotgg/t3code main at ${D.tip.hash.slice(0, 10)}</a>, fetched ${dayLabel(D.tip.date)}, ${year}. The custom mobile fork is excluded. ${esc(D.eventRule || '')} Blue diamonds mark major milestones, including any that are also large PRs; hollow white diamonds mark the other large PRs. This is a snapshot through ${dayLabel(D.tip.date)}, ${year}; automatic updates are unavailable.`;

function renderContributors() {
  if (!C) {
    $('#contributors-section').hidden = true;
    return;
  }
  const top = C.top.slice(0, 10), max = top[0].added;
  $('#contrib-sub').textContent = `Ranked by added source-file lines across ${fmt(C.contributors)} contributors. Rewrites count again; these totals do not measure code ownership.`;
  $('#bars').innerHTML = top.map((c, i) => `<li><button type="button" class="row" data-rank="${i}" aria-pressed="false"><span class="rank">${i + 1}</span><span class="name">${esc(c.name)}</span><span class="val">${fmt(c.added)}</span><span class="track"><span class="fill" style="width:${(c.added / max * 100).toFixed(2)}%"></span></span></button></li>`).join('');
  const sel = $('#selected');
  function select(i) {
    document.querySelectorAll('.row').forEach(r => {
      const on = Number(r.dataset.rank) === i;
      r.classList.toggle('is-on', on);
      r.setAttribute('aria-pressed', on);
    });
    const c = top[i];
    sel.innerHTML = `<div class="who"><strong>${esc(c.name)}</strong><span>${pct(c.added / C.totalAdded)} of added lines</span></div><p class="detail-line">${fmt(c.deleted)} deleted · ${signed(c.net)} net · ${fmt(c.commits)} commits</p>`;
  }
  const bars = $('#bars');
  const pick = e => {
    const row = e.target.closest('.row');
    if (row) select(Number(row.dataset.rank));
  };
  // Touch selects on click, so a tap does not flash the row under the finger first.
  bars.addEventListener('pointerover', e => { if (e.pointerType === 'mouse') pick(e); });
  bars.addEventListener('focusin', pick);
  bars.addEventListener('click', pick);
  select(0);
  $('#cmethod').innerHTML = `${esc(C.metric)} ${esc(C.method)}`;
}

function initChart() {
  const plot = $('#plot'), svg = d3.select('#chart'), tip = $('#readout');
  // pinned starts at the latest point and changes on tap, click, milestone, or arrow key. hover is a desktop pointer position and wins while present.
  let pinned = null, pinnedEvent = null, hover = null, layout = null;
  const pointIndex = e => points.findIndex(p => p.hash === e.hash);
  const nearest = ev => d3.bisector(q => q.x).center(points, layout.x.invert(d3.pointer(ev, svg.node())[0]));
  const pin = ev => { pinned = nearest(ev); pinnedEvent = null; hover = null; render(); };
  // Pointer events can arrive several times per frame, and crossing onto a marker fires the plot's leave just before the marker's enter. Coalescing to one render per frame keeps fast sweeps smooth and stops the readout flashing back to the pinned point in between.
  let frame = 0;
  const setHover = i => { hover = i; frame ||= requestAnimationFrame(() => { frame = 0; render(); }); };
  // Moves an element by transform. snap skips the glide, used when appearing, after a redraw, or when the readout changes sides so it never sweeps across the selected point.
  let shown = false, last = '', side = null, lastT = null;
  const place = (el, t, snap) => {
    if (snap) el.style.transition = 'none';
    el.style.transform = t;
    if (snap) { el.getBoundingClientRect(); el.style.transition = ''; }
  };

  // One readout and one selection state drive the chart, the milestone list and the arrow keys. Redraws re-apply it, so resizing keeps the same point.
  function render() {
    const i = hover ?? pinned, p = i == null ? null : points[i];
    const e = p && (hover == null && pinnedEvent ? events.find(ev => ev.id === pinnedEvent) : events.find(ev => ev.hash === p.hash)), id = e ? String(e.id) : null;
    document.querySelectorAll('.marker, .milestone').forEach(el => {
      const on = el.dataset.id === id;
      el.classList.toggle('is-on', on);
      if (el.classList.contains('milestone')) el.setAttribute('aria-pressed', on);
    });
    if (frame) { cancelAnimationFrame(frame); frame = 0; }
    if (!layout) return;
    const {x, y, w, narrow, guide, dot} = layout;
    if (!p) {
      shown = false;
      last = '';
      tip.hidden = true;
      guide.attr('visibility', 'hidden');
      dot.attr('visibility', 'hidden');
      return;
    }
    const px = x(p.x), key = `${i}:${id}:${w}`;
    if (key === last) return;
    const snap = !shown;
    last = key;
    shown = true;
    place(guide.node(), `translate(${px}px,0)`, snap);
    place(dot.node(), `translate(${px}px,${y(p.total)}px)`, snap);
    guide.attr('visibility', 'visible');
    dot.attr('visibility', 'visible');
    tip.hidden = false;
    tip.innerHTML = e
      ? `<strong>${esc(e.label)}</strong>${isMajor(e) && e.pr ? '<br>PR #' + e.pr + ' · ' + esc(e.prTitle) : ''}${e.pr ? '<br>PR changed lines: ' + fmt(e.changed) + ' (+' + fmt(e.added) + ' / −' + fmt(e.deleted) + ')' : ''}<br>Source total: ${fmt(p.total)} lines · ${dayLabel(p.date)}, ${p.date.slice(0, 4)} · ${fmt(p.files)} files<br><span>${p.hash.slice(0, 8)} · ${esc(p.subject)}</span>`
      : `<strong>${fmt(p.total)} lines</strong><br>${dayLabel(p.date)}, ${p.date.slice(0, 4)} · ${fmt(p.files)} files<br><span>${p.hash.slice(0, 8)} · ${esc(p.subject)}</span>`;
    if (!narrow) placeTip(px, y(p.total), snap);
  }

  // The tip stays inside the plot area beside the inspected point, entirely left or right of the guide. Each candidate height on each side is scored: covering the selected point or marker is effectively forbidden, then crossing the line or another marker costs heavily, then distance from the point breaks ties. The open space above the rising line usually wins.
  // While the pointer sweeps, staying on the current side and height is mildly preferred so the readout does not hop on every point; any real collision still wins.
  function placeTip(px, py, snap) {
    const {m, right, bottom, line} = layout, box = plot.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14;
    const rectOf = el => {
      const r = el.getBoundingClientRect();
      return {l: r.left - box.left - 4, t: r.top - box.top - 4, r: r.right - box.left + 4, b: r.bottom - box.top + 4};
    };
    const hard = [...plot.querySelectorAll('.marker.is-on .diamond')].map(rectOf);
    hard.push({l: px - 8, t: py - 8, r: px + 8, b: py + 8});
    const soft = [...plot.querySelectorAll('.marker:not(.is-on) .diamond')].map(rectOf);
    const overlap = (a, b) => Math.max(0, Math.min(a.r, b.r) - Math.max(a.l, b.l)) * Math.max(0, Math.min(a.b, b.b) - Math.max(a.t, b.t));
    const area = (a, boxes) => boxes.reduce((sum, b) => sum + overlap(a, b), 0);
    // Line height at a screen x, interpolated between snapshots.
    const lineAt = sx => {
      const i = Math.min(Math.max(d3.bisector(q => q[0]).left(line, sx), 1), line.length - 1), [x0, y0] = line[i - 1], [x1, y1] = line[i];
      return x1 === x0 ? y1 : y0 + (y1 - y0) * Math.min(Math.max((sx - x0) / (x1 - x0), 0), 1);
    };
    const lineHits = c => {
      let n = 0;
      for (let sx = c.l; sx <= c.r; sx += 4) { const ly = lineAt(sx); if (ly > c.t - 6 && ly < c.b + 6) n++; }
      return n;
    };
    const minL = m.l, maxL = right - tw, minT = m.t, maxT = Math.max(m.t, bottom - th);
    let sides = [px + gap, px - tw - gap].filter(l => l >= minL && l <= maxL);
    if (!sides.length) sides = [Math.min(Math.max(px + gap, minL), maxL), Math.min(Math.max(px - tw - gap, minL), maxL)];
    let best = null;
    for (const l of sides) {
      for (let t = minT; t <= maxT + 0.5; t += 6) {
        const c = {l, t, r: l + tw, b: t + th};
        const s = l < px ? 'l' : 'r', sticky = hover != null && side && !snap ? (s === side ? 0 : 150) + Math.abs(t - lastT) * 0.4 : 0;
        const score = area(c, hard) * 1e6 + lineHits(c) * 4000 + area(c, soft) * 60 + Math.abs(t + th / 2 - py) + (s === 'l' ? 20 : 0) + sticky;
        if (!best || score < best.score) best = {l, t, s, score};
      }
    }
    place(tip, `translate(${best.l}px,${best.t}px)`, snap || best.s !== side);
    side = best.s;
    lastT = best.t;
  }

  function drawChart() {
    const w = plot.clientWidth, narrow = w < 480, h = narrow ? 300 : 360;
    const m = narrow ? {l: 48, r: 14, t: 30, b: 40} : {l: 60, r: 14, t: 20, b: 50};
    const right = w - m.r, bottom = h - m.b;
    const x = d3.scaleUtc().domain(d3.extent(points, p => p.x)).range([m.l + 10, right - 10]);
    const y = d3.scaleLinear().domain([0, d3.max(points, p => p.total) * 1.1]).nice().range([bottom, m.t]);
    plot.classList.toggle('is-narrow', narrow);
    pinned ??= points.length - 1;
    shown = false;
    last = '';
    svg.selectAll('*').remove();
    svg.attr('width', w).attr('height', h).attr('viewBox', `0 0 ${w} ${h}`);
    svg.append('desc').text('Growth from 560 to 1,483,136 source-file lines. Blue diamonds are major milestones; white diamonds are other merged PRs over 20,000 changed lines.');
    svg.append('text').attr('x', (m.l + right) / 2).attr('y', h - 3).attr('text-anchor', 'middle').attr('fill', 'var(--muted)').text('2026 · commit date');
    if (narrow) svg.append('text').attr('class', 'axis-unit').attr('x', 0).attr('y', 14).text('Source-file lines');

    const yAxis = svg.append('g').attr('class', 'axis').attr('transform', `translate(${m.l},0)`)
      .call(d3.axisLeft(y).ticks(4).tickFormat(d3.format('.2~s')).tickSize(m.l - right).tickPadding(8));
    yAxis.select('.domain').remove();
    yAxis.selectAll('.tick line').attr('x1', 0);
    svg.append('g').attr('class', 'axis').attr('transform', `translate(0,${bottom})`)
      .call(d3.axisBottom(x).ticks(narrow ? d3.utcMonth.every(2) : d3.utcMonth).tickFormat(d3.utcFormat('%b')).tickSize(0).tickPadding(10))
      .select('.domain').remove();

    svg.append('path').datum(points).attr('fill', 'var(--accent)').attr('fill-opacity', .09)
      .attr('d', d3.area().x(p => x(p.x)).y0(bottom).y1(p => y(p.total)));
    svg.append('path').datum(points).attr('fill', 'none').attr('stroke', 'var(--accent)').attr('stroke-width', 2).attr('stroke-linejoin', 'round')
      .attr('d', d3.line().x(p => x(p.x)).y(p => y(p.total)));

    // One diamond per event, on the line at its commit. Majors draw last and larger, so a blue diamond is never hidden under a white one.
    [...largeEvents.filter(e => !isMajor(e)), ...coreEvents].forEach(e => {
      const px = x(e.x), py = y(e.total), idx = pointIndex(e), s = isMajor(e) ? 7 : 5.5;
      svg.append('g').attr('class', isMajor(e) ? 'marker major' : 'marker').attr('data-id', e.id)
        .on('pointerenter', () => { if (!narrow) setHover(idx); })
        .on('pointerleave', () => { if (!narrow) setHover(null); })
        .on('click', () => { pinned = idx; pinnedEvent = e.id; hover = null; render(); })
        .append('path').attr('class', 'diamond').attr('d', `M${px},${py - s}l${s},${s}l-${s},${s}l-${s},-${s}Z`);
    });

    const guide = svg.append('line').attr('class', 'guide').attr('x1', 0).attr('x2', 0).attr('y1', m.t).attr('y2', bottom).attr('visibility', 'hidden');
    const dot = svg.append('circle').attr('class', 'hover-dot').attr('r', 4).attr('fill', 'var(--accent)').attr('visibility', 'hidden');
    layout = {x, y, w, narrow, guide, dot, m, right, bottom, line: points.map(p => [x(p.x), y(p.total)])};

    // Touch scrubs and taps on phones. Vertical drags pan the page because touch-action is pan-y.
    svg.append('rect').attr('x', m.l).attr('y', m.t).attr('width', right - m.l).attr('height', bottom - m.t)
      .attr('fill', 'transparent').style('touch-action', 'pan-y')
      .on('pointerdown', ev => { if (!narrow) pin(ev); })
      .on('pointerup', ev => { if (narrow) pin(ev); })
      .on('pointermove', ev => {
        if (narrow) { if (ev.buttons) pin(ev); return; }
        setHover(nearest(ev));
      })
      .on('pointerleave', () => setHover(null));
    svg.selectAll('.marker').raise();
    render();
  }

  $('#milestones').addEventListener('click', e => {
    const b = e.target.closest('.milestone');
    if (!b) return;
    pinnedEvent = Number(b.dataset.id);
    pinned = pointIndex(events.find(ev => ev.id === pinnedEvent));
    hover = null;
    render();
    if (layout?.narrow) tip.scrollIntoView({block: 'nearest', behavior: 'instant'});
  });
  svg.node().addEventListener('eventlistchange', render);
  const moves = {ArrowLeft: -1, ArrowRight: 1, Home: -Infinity, End: Infinity};
  svg.node().addEventListener('keydown', e => {
    if (!(e.key in moves)) return;
    e.preventDefault();
    pinned = Math.min(Math.max((pinned ?? points.length - 1) + moves[e.key], 0), points.length - 1);
    pinnedEvent = null;
    hover = null;
    render();
  });
  new ResizeObserver(drawChart).observe(plot);
}

function chartUnavailable() {
  $('#milestone-details').remove();
  $('#plot').innerHTML = '<p class="note" role="status">The chart library could not load, so the growth plot is unavailable. Reload to try again.</p>';
}

renderContributors();
if (window.d3) initChart();
else chartUnavailable();
</script>
